name: lint

on:
  push:
  pull_request:

jobs:
  validate-snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate snippet files
        run: node tools/validate-snippets.mjs
